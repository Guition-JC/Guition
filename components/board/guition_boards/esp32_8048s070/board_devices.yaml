# Generated SD overlay: tools/guition/sd_boards.py
devices:
  - name: display_lcd
    type: display_lcd
    version: 1.0.0
    sub_type: rgb
    chip: st7262
    config:
      x_max: 800
      y_max: 480
      swap_xy: false
      mirror_x: false
      mirror_y: false
      invert_color: false
      need_reset: true
      frame_format: RGB565_LE
      bits_per_pixel: 16
      rgb_ele_order: LCD_RGB_ELEMENT_ORDER_RGB
      data_endian: LCD_RGB_DATA_ENDIAN_LITTLE
      rgb_panel_config:
        clk_src: LCD_CLK_SRC_DEFAULT
        data_width: 16
        in_color_format: LCD_COLOR_FMT_RGB565
        out_color_format: LCD_COLOR_FMT_RGB565
        num_fbs: 2
        bounce_buffer_size_px: 8000
        dma_burst_size: 64
        data_gpio_nums: [15, 7, 6, 5, 4, 9, 46, 3, 8, 16, 1, 14, 21, 47, 48, 45]
        timings:
          pclk_hz: 16000000
          h_res: 800
          v_res: 480
          hsync_pulse_width: 30
          hsync_back_porch: 16
          hsync_front_porch: 210
          vsync_pulse_width: 13
          vsync_back_porch: 10
          vsync_front_porch: 22
          flags:
            pclk_active_neg: false
        flags:
          fb_in_psram: true
        hsync_gpio_num: 39
        vsync_gpio_num: 40
        de_gpio_num: 41
        pclk_gpio_num: 42
        disp_gpio_num: -1

  - name: lcd_touch
    type: lcd_touch
    sub_type: i2c
    chip: gt911
    init_skip: true
    config:
      touch_config:
        x_max: 800
        y_max: 480
        rst_gpio_num: 38
        int_gpio_num: -1
        levels:
          reset: 0
          interrupt: 0
        flags:
          swap_xy: false
          mirror_x: false
          mirror_y: false
      io_i2c_config:
        scl_speed_hz: 400000
        control_phase_bytes: 1
        dc_bit_offset: 0
        lcd_cmd_bits: 16
        lcd_param_bits: 0
        transaction_timeout_ms: 0
        flags:
          dc_low_on_data: false
          disable_control_phase: true
    peripherals:
      - i2c_name: i2c_touch
        i2c_addr: [0xBA]
    dependencies:
      espressif/esp_lcd_touch:
        version: ==1.2.1
        public: true
      espressif/esp_lcd_touch_gt911:
        version: ==1.2.1
        public: true
        matches:
          - if: $CONFIG{GUITION_TOUCH_CAPACITIVE} == True

  - name: lcd_brightness
    type: gpio_ctrl
    config:
      active_level: 1
      default_level: 0
    peripherals:
      - gpio_name: gpio_backlight

  - name: fs_sdcard
    type: fs_fat
    sub_type: spi
    config:
      mount_point: "/sdcard"
      vfs_config:
        format_if_mount_failed: false
        max_files: 5
        allocation_unit_size: 16384
      sub_config:
        cs_gpio_num: 10
        frequency: SDMMC_FREQ_DEFAULT
    peripherals:
      - spi_name: spi_sdcard
